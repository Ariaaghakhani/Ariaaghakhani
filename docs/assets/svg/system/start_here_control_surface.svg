<svg width="1100" height="300" viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Start Here</title>
  <desc id="desc">Routes into projects, technologies, and contact for Aria Aghakhani</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#111A33"/>
      <stop offset="100%" stop-color="#0D1430"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#42B883" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-120 0;120 0;-120 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="route" x1="100" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#42B883"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#42B883" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1100" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1100" height="300" rx="28" fill="url(#grid)"/>
  <rect x="16" y="16" width="1068" height="268" rx="22" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="410 145" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-555" dur="26s" repeatCount="indefinite"/>
  </rect>
  <text x="64" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="4" fill="#42B883">START HERE</text>
  <text x="64" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="900" fill="#F8FAFC">&lt;AriaProfile /&gt;</text>
  <text x="64" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#94A3B8">Routes into my Vue / Nuxt work, the tools I use daily, and how to reach me.</text>
  <g transform="translate(760 48)">
    <rect width="280" height="70" rx="16" fill="#0B1020" fill-opacity="0.7" stroke="#26335C"/>
    <text x="22" y="30" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="800" fill="#42B883">&gt; app.mount('#profile')</text>
    <text x="22" y="52" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="800" fill="#42B883">&gt; routes: 03 ready</text>
  </g>
  <path d="M126 200H974" stroke="url(#route)" stroke-width="3" stroke-linecap="round" stroke-dasharray="42 24" opacity="0.7" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-132" dur="20s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(86 168)">
    <rect width="286" height="86" rx="18" fill="#0B1020" fill-opacity="0.88" stroke="#42B883" stroke-width="1.6"/>
    <circle cx="34" cy="43" r="13" fill="#42B883" filter="url(#glow)"><animate attributeName="r" values="12;14;12" dur="9s" repeatCount="indefinite"/></circle>
    <text x="64" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="2" fill="#42B883">FEATURED WORK</text>
    <text x="64" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#F8FAFC">Projects</text>
  </g>
  <g transform="translate(407 168)">
    <rect width="286" height="86" rx="18" fill="#0B1020" fill-opacity="0.88" stroke="#38BDF8" stroke-width="1.6"/>
    <circle cx="34" cy="43" r="13" fill="#38BDF8" filter="url(#glow)"><animate attributeName="r" values="12;14;12" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
    <text x="64" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="2" fill="#38BDF8">DAILY TOOLKIT</text>
    <text x="64" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#F8FAFC">Technologies</text>
  </g>
  <g transform="translate(728 168)">
    <rect width="286" height="86" rx="18" fill="#0B1020" fill-opacity="0.88" stroke="#A78BFA" stroke-width="1.6"/>
    <circle cx="34" cy="43" r="13" fill="#A78BFA" filter="url(#glow)"><animate attributeName="r" values="12;14;12" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
    <text x="64" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="2" fill="#A78BFA">SAY HELLO</text>
    <text x="64" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#F8FAFC">Contact</text>
  </g>
</svg>
